<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Giriş Yap | Kuantizma</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="kart">
    <h1>Kuantizma</h1>
    <p class="description">Kuantum dünyasına giriş yapmak için bilgilerinizi girin</p>

    <form action="kuantizma1.html" method="GET">
      <div class="form-group">
        <label for="email">E-posta</label>
        <input type="email" id="email" name="email" placeholder="ornek@mail.com" required>
      </div>

      <div class="form-group">
        <label for="sifre">Şifre</label>
        <input type="password" id="sifre" name="sifre" placeholder="••••••••" required>
      </div>

      <button type="submit">Giriş Yap</button>
    </form>

    <p class="alt">Hesabın yok mu? <a href="#">Kayıt ol</a></p>
  </div>

</body>
</html>
